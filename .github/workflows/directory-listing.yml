name: Generate Directory Listing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Directory Listing
        uses: gacts/directory-listing@v1.0.4
        with:
          FOLDER: .   # keep this if the action writes files into repo; next step will copy into public/

      - name: Prepare site folder
        run: |
          rm -rf public
          mkdir public
          # copy repo files into public reliably, excluding .git and the public folder itself
          # adjust the source path if your generated site files are in a different folder
          rsync -av --delete --exclude='.git' --exclude='public' ./ public/

      - name: Inspect site contents
        run: |
          echo "Public folder size and listing:"
          du -sh public || true
          ls -la public || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4