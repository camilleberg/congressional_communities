<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Congressional Community Map</title></head>
<body>
  <div id="plot">Loading…</div>
  <script type="module">
    import { parseSpec } from "https://cdn.jsdelivr.net/npm/@uwdata/mosaic-spec/+esm";
    import { astToDOM }   from "https://cdn.jsdelivr.net/npm/@uwdata/mosaic-spec/+esm";
    import * as vg        from "https://cdn.jsdelivr.net/npm/@uwdata/vgplot/+esm";

    vg.coordinator().databaseConnector(await vg.wasmConnector());

    const spec = await fetch("../data/cc_map.spec.json").then(r => r.json());
    const ast = parseSpec(spec);
    const { element } = await astToDOM(ast, { baseURL: "." });

    document.getElementById("plot").replaceChildren(element);
  </script>
</body>
</html>
